<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Menu Cafe Digital</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    padding:15px;
    max-width:700px;
    margin:auto;
}

.header{
    background:#222;
    color:white;
    padding:20px;
    border-radius:15px;
    text-align:center;
    margin-bottom:20px;
}

.header h1{
    margin-bottom:10px;
}

.table-info{
    background:#ff9800;
    color:white;
    padding:8px 15px;
    border-radius:20px;
    display:inline-block;
}

.menu-card{
    background:white;
    border-radius:15px;
    padding:15px;
    margin-bottom:15px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.menu-title{
    font-size:18px;
    font-weight:bold;
}

.menu-price{
    color:#666;
    margin:10px 0;
}

.add-btn{
    background:#4CAF50;
    color:white;
    border:none;
    padding:10px 15px;
    border-radius:8px;
    width:100%;
    cursor:pointer;
}

.add-btn:hover{
    opacity:.9;
}

.cart{
    background:white;
    border-radius:15px;
    padding:20px;
    margin-top:20px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.cart h2{
    margin-bottom:15px;
}

.cart-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
    padding-bottom:10px;
    border-bottom:1px solid #eee;
}

.qty-box{
    display:flex;
    align-items:center;
    gap:8px;
}

.qty-btn{
    width:30px;
    height:30px;
    border:none;
    border-radius:50%;
    background:#ddd;
    cursor:pointer;
    font-weight:bold;
}

.total{
    margin-top:15px;
    font-size:22px;
    font-weight:bold;
}

.order-btn{
    width:100%;
    margin-top:15px;
    background:#25D366;
    color:white;
    border:none;
    padding:15px;
    border-radius:10px;
    font-size:18px;
    cursor:pointer;
}

.order-btn:hover{
    opacity:.9;
}

.empty{
    color:#888;
    text-align:center;
}

.badge{
    background:red;
    color:white;
    padding:3px 8px;
    border-radius:20px;
    font-size:12px;
}

.input-group{
    margin-bottom:15px;
}

.input-group label{
    display:block;
    margin-bottom:6px;
    font-weight:bold;
}

.input-group input,
.input-group textarea{
    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:8px;
}

.input-group textarea{
    min-height:80px;
    resize:vertical;
}

</style>
</head>
<body>

<div class="header">

    <h1>☕ Menu Cafe</h1>

    <div class="table-info" id="tableInfo">
        Meja -
    </div>

</div>

<div class="menu-card">
    <div class="menu-title">Kopi Susu</div>
    <div class="menu-price">Rp18.000</div>
    <button class="add-btn"
        onclick="addItem('Kopi Susu',18000)">
        Tambah
    </button>
</div>

<div class="menu-card">
    <div class="menu-title">Americano</div>
    <div class="menu-price">Rp15.000</div>
    <button class="add-btn"
        onclick="addItem('Americano',15000)">
        Tambah
    </button>
</div>

<div class="menu-card">
    <div class="menu-title">Mie Goreng</div>
    <div class="menu-price">Rp20.000</div>
    <button class="add-btn"
        onclick="addItem('Mie Goreng',20000)">
        Tambah
    </button>
</div>

<div class="menu-card">
    <div class="menu-title">Nasi Goreng</div>
    <div class="menu-price">Rp25.000</div>
    <button class="add-btn"
        onclick="addItem('Nasi Goreng',25000)">
        Tambah
    </button>
</div>

<div class="cart">

    <h2>
        Keranjang
        <span class="badge" id="itemCount">0</span>
    </h2>

    <div class="input-group">
        <label>Atas Nama</label>
        <input
            type="text"
            id="customerName"
            placeholder="Masukkan nama pelanggan">
    </div>

    <div id="cartList">

        <div class="empty">
            Belum ada pesanan
        </div>

    </div>

    <div class="total">
        Total:
        <span id="totalHarga">Rp0</span>
    </div>

    <div class="input-group">
        <label>Catatan Pesanan</label>

        <textarea
            id="orderNote"
            placeholder="Contoh: tanpa gula, pedas level 2, tanpa bawang..."></textarea>
    </div>

    <button
        class="order-btn"
        onclick="sendOrder()">
        Pesan via WhatsApp
    </button>

</div>

<script>

const params =
    new URLSearchParams(window.location.search);

const tableNumber =
    params.get("table") || "-";

document.getElementById("tableInfo").innerHTML =
    "Meja " + tableNumber;

let cart = {};

function addItem(name,price){

    if(cart[name]){

        cart[name].qty++;

    }else{

        cart[name] = {
            qty:1,
            price:price
        };

    }

    renderCart();
}

function increase(name){

    cart[name].qty++;

    renderCart();
}

function decrease(name){

    cart[name].qty--;

    if(cart[name].qty <= 0){

        delete cart[name];
    }

    renderCart();
}

function renderCart(){

    let html = "";
    let total = 0;
    let count = 0;

    for(let item in cart){

        let qty = cart[item].qty;

        let subtotal =
            qty * cart[item].price;

        total += subtotal;
        count += qty;

        html += `
        <div class="cart-item">

            <div>
                <strong>${item}</strong><br>
                Rp${subtotal.toLocaleString('id-ID')}
            </div>

            <div class="qty-box">

                <button
                    class="qty-btn"
                    onclick="decrease('${item}')">
                    -
                </button>

                ${qty}

                <button
                    class="qty-btn"
                    onclick="increase('${item}')">
                    +
                </button>

            </div>

        </div>
        `;
    }

    if(count === 0){

        html = `
        <div class="empty">
            Belum ada pesanan
        </div>`;
    }

    document.getElementById("cartList").innerHTML =
        html;

    document.getElementById("itemCount").innerHTML =
        count;

    document.getElementById("totalHarga").innerHTML =
        "Rp" + total.toLocaleString('id-ID');
}

function sendOrder(){

    if(Object.keys(cart).length === 0){

        alert("Belum ada pesanan");

        return;
    }

    const customerName =
        document.getElementById("customerName")
        .value
        .trim();

    if(customerName === ""){

        alert("Silakan isi nama terlebih dahulu");

        return;
    }

    let total = 0;

    let message =
`Pesanan Baru

Meja ${tableNumber}
Atas Nama: ${customerName}

`;

    for(let item in cart){

        let qty = cart[item].qty;

        total += qty * cart[item].price;

        message += `${item} x${qty}
`;
    }

    const note =
        document.getElementById("orderNote").value;

    message += `
Total: Rp${total.toLocaleString('id-ID')}
`;

    if(note.trim() !== ""){

        message += `

Catatan:
${note}
`;
    }

    let url =
        "https://wa.me/6287857365303?text=" +
        encodeURIComponent(message);

    window.open(url,"_blank");
}

</script>

</body>
</html>
