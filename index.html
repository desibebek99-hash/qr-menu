<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Menu Cafe Digital</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,sans-serif;
    background:#f5f5f5;
    padding:15px;
    max-width:700px;
    margin:auto;
}

.header{
    background-image:url('images/header.jpg');
    background-size:cover;
    background-position:center;
    background-repeat:no-repeat;

    height:220px;

    border-radius:15px;

    display:flex;
    align-items:flex-end;
    justify-content:center;

    padding:20px;

    margin-bottom:20px;

    position:relative;
    overflow:hidden;

}

.header h1{
    margin-bottom:10px;
}

.table-info{
    background:#ff9800;
    color:white;
    padding:8px 15px;
    border-radius:20px;
    display:inline-block;
}

.menu-card{
    background:white;
    border-radius:15px;
    padding:15px;
    margin-bottom:15px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.menu-title{
    font-size:18px;
    font-weight:bold;
}

.menu-price{
    color:#666;
    margin:10px 0;
}

.add-btn{
    background:#4CAF50;
    color:white;
    border:none;
    padding:10px 15px;
    border-radius:8px;
    width:100%;
    cursor:pointer;
}

.add-btn:hover{
    opacity:.9;
}

.cart{
    background:white;
    border-radius:15px;
    padding:20px;
    margin-top:20px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.cart h2{
    margin-bottom:15px;
}

.cart-item{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:10px;
    padding-bottom:10px;
    border-bottom:1px solid #eee;
}

.qty-box{
    display:flex;
    align-items:center;
    gap:8px;
}

.qty-btn{
    width:30px;
    height:30px;
    border:none;
    border-radius:50%;
    background:#ddd;
    cursor:pointer;
    font-weight:bold;
}

.total{
    margin-top:15px;
    font-size:22px;
    font-weight:bold;
}

.order-btn{
    width:100%;
    margin-top:15px;
    background:#25D366;
    color:white;
    border:none;
    padding:15px;
    border-radius:10px;
    font-size:18px;
    cursor:pointer;
}

.order-btn:hover{
    opacity:.9;
}

.empty{
    color:#888;
    text-align:center;
}

.badge{
    background:red;
    color:white;
    padding:3px 8px;
    border-radius:20px;
    font-size:12px;
}

.input-group{
    margin-bottom:15px;
}

.input-group label{
    display:block;
    margin-bottom:6px;
    font-weight:bold;
}

.input-group input,
.input-group textarea{
    width:100%;
    padding:10px;
    border:1px solid #ccc;
    border-radius:8px;
}

.input-group textarea{
    min-height:80px;
    resize:vertical;
}

.menu-image{
    width:100%;
    height:200px;
    object-fit:cover;
    border-radius:10px;
    margin-bottom:10px;
}
.menu-container{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:15px;
}    

.category-bar{
    display:flex;
    gap:10px;
    overflow-x:auto;
    margin-bottom:20px;
}
.category-btn{
    border:none;
    padding:10px 15px;
    border-radius:20px;
    cursor:pointer;
    background:#eee;
}

</style>
</head>
<body>

<div class="header">

    <div
        class="table-info"
        id="tableInfo">
        Meja -
    </div>

</div>

</div>
<div class="category-bar">
<button class="category-btn" onclick="filterMenu('all')">Semua</button>
<button class="category-btn" onclick="filterMenu('minuman')">Minuman</button>
<button class="category-btn" onclick="filterMenu('makanan')">Makanan</button>
<button class="category-btn" onclick="filterMenu('camilan')">Camilan</button>
</div>

<div class="menu-container">
<div class="menu-card minuman">

    <img
        src="images/kopi-susu.jpg"
        class="menu-image"
        alt="Kopi Susu">

    <div class="menu-title">
        Kopi Susu
    </div>

    <div class="menu-price">
        Rp18.000
    </div>

    <button
        class="add-btn"
        onclick="addItem('Kopi Susu',18000)">
        Tambah
    </button>

</div>

<div class="menu-card minuman">

    <img
        src="images/soda-gembira.jpg"
        class="menu-image"
        alt="Soda Gembira">

    <div class="menu-title">
        Soda Gembira
    </div>

    <div class="menu-price">
        Rp18.000
    </div>

    <button
        class="add-btn"
        onclick="addItem('Soda Gembira',18000)">
        Tambah
    </button>

</div>

<div class="menu-card minuman">

    <img
        src="images/es-teh.jpg"
        class="menu-image"
        alt="Es Teh">

    <div class="menu-title">
        Es Teh
    </div>

    <div class="menu-price">
        Rp5.000
    </div>

    <button
        class="add-btn"
        onclick="addItem('Es Teh',5000)">
        Tambah
    </button>

</div>

<div class="menu-card minuman">

    <img
        src="images/es-kopi.jpg"
        class="menu-image"
        alt="Es Kopi">

    <div class="menu-title">
        Es Kopi
    </div>

    <div class="menu-price">
        Rp15.000
    </div>

    <button
        class="add-btn"
        onclick="addItem('Es Kopi',15000)">
        Tambah
    </button>

</div>
    

<div class="menu-card minuman">

    <img
        src="images/americano.jpg"
        class="menu-image"
        alt="Americano">

    <div class="menu-title">
        Americano
    </div>

    <div class="menu-price">
        Rp20.000
    </div>

    <button
        class="add-btn"
        onclick="addItem('Americano',20000)">
        Tambah
    </button>

</div>
<div class="menu-card makanan">

    <img
        src="images/mie-goreng.jpg"
        class="menu-image"
        alt="Mie Goreng">

    <div class="menu-title">
        Mie Goreng
    </div>

    <div class="menu-price">
        Rp25.000
    </div>

    <button
        class="add-btn"
        onclick="addItem('Mie Goreng',25000)">
        Tambah
    </button>

</div>

<div class="menu-card makanan">

    <img
        src="images/nasi-goreng.jpg"
        class="menu-image"
        alt="Nasi Goreng">

    <div class="menu-title">
        Nasi Goreng
    </div>

    <div class="menu-price">
        Rp25.000
    </div>

    <button
        class="add-btn"
        onclick="addItem('Nasi Goreng',25000)">
        Tambah
    </button>

</div>

<div class="menu-card makanan">

    <img
        src="images/nasi-kuning.jpg"
        class="menu-image"
        alt="Nasi Kuning">

    <div class="menu-title">
        Nasi Kuning
    </div>

    <div class="menu-price">
        Rp25.000
    </div>

    <button
        class="add-btn"
        onclick="addItem('Nasi Kuning',25000)">
        Tambah
    </button>

</div>

<div class="menu-card makanan">

    <img
        src="images/ayam-goreng.jpg"
        class="menu-image"
        alt="Ayam Goreng">

    <div class="menu-title">
        Ayam Goreng
    </div>

    <div class="menu-price">
        Rp25.000
    </div>

    <button
        class="add-btn"
        onclick="addItem('Ayam Goreng',25000)">
        Tambah
    </button>

</div>

<div class="menu-card makanan">

    <img
        src="images/sate-kambing.jpg"
        class="menu-image"
        alt="Sate Kambing">

    <div class="menu-title">
        Sate Kambing
    </div>

    <div class="menu-price">
        Rp25.000
    </div>

    <button
        class="add-btn"
        onclick="addItem('Sate Kambing',25000)">
        Tambah
    </button>

</div>


</div>
<div class="cart">

    <h2>
        Keranjang
        <span class="badge" id="itemCount">0</span>
    </h2>

    <div class="input-group">
        <label>Atas Nama</label>
        <input type="text" id="customerName" placeholder="Masukkan nama pelanggan">
    </div>

    <div id="cartList">

        <div class="empty">
            Belum ada pesanan
        </div>

    </div>

    <div class="total">
        Total:
        <span id="totalHarga">Rp0</span>
    </div>
    
    <div class="input-group">

    <label>Metode Pembayaran</label>

    <label style="display:block;margin-top:8px;">
        <input
            type="radio"
            name="paymentMethod"
            value="Cash">
        Cash
    </label>

    <label style="display:block;margin-top:8px;">
        <input
            type="radio"
            name="paymentMethod"
            value="QRIS">
        QRIS
    </label>

    </div>
    <div
    id="qrisSection"
    style="display:none;margin-top:15px;">

    <h3>Pembayaran QRIS</h3>

    <img
        src="images/qris.jpg"
        alt="QRIS"
        style="
            width:100%;
            max-width:300px;
            display:block;
            margin:auto;
            border-radius:10px;
        ">

    <p style="
        text-align:center;
        margin-top:10px;
        color:#666;
    ">
        Scan QRIS untuk pembayaran
    </p>

</div>
    
    <div class="input-group">
        <label>Catatan Pesanan</label>

        <textarea
            id="orderNote"
            placeholder="Contoh: tanpa gula, pedas level 2, tanpa bawang..."></textarea>
    </div>

    <button
        class="order-btn"
        onclick="sendOrder()">
        Pesan via WhatsApp
    </button>

</div>
<script>

const params =
    new URLSearchParams(window.location.search);

const tableNumber =
    params.get("table") || "-";

document.getElementById("tableInfo").innerHTML =
    "Meja " + tableNumber;
const savedName =
localStorage.getItem("customerName");

if(savedName){

    document.getElementById(
        "customerName"
    ).value = savedName;

}

document
.getElementById("customerName")
.addEventListener("input",function(){

    localStorage.setItem(
        "customerName",
        this.value
    );

});
let cart =
JSON.parse(localStorage.getItem("cart")) || {};

function saveCart(){

    localStorage.setItem(
        "cart",
        JSON.stringify(cart)
    );

}
    document.addEventListener("change",function(e){

    if(e.target.name === "paymentMethod"){

        const qrisSection =
        document.getElementById("qrisSection");

        if(e.target.value === "QRIS"){

            qrisSection.style.display = "block";

        }else{

            qrisSection.style.display = "none";

        }

    }

});

function addItem(name,price){

    if(cart[name]){

        cart[name].qty++;

    }else{

        cart[name] = {
            qty:1,
            price:price
        };

    }

    saveCart();
    renderCart();

}
   
function filterMenu(category){

    const menus =
    document.querySelectorAll('.menu-card');

    menus.forEach(menu=>{

        if(
            category === 'all' ||
            menu.classList.contains(category)
        ){

            menu.style.display = '';

        }else{

            menu.style.display = 'none';

        }

    });

}

function increase(name){

    cart[name].qty++;

    saveCart();
    renderCart();
}

function decrease(name){

    cart[name].qty--;

    if(cart[name].qty <= 0){

        delete cart[name];
    }

    saveCart();
    renderCart();
}

function renderCart(){

    let html = "";
    let total = 0;
    let count = 0;

    for(let item in cart){

        let qty = cart[item].qty;

        let subtotal =
            qty * cart[item].price;

        total += subtotal;
        count += qty;

        html += `
        <div class="cart-item">

            <div>
                <strong>${item}</strong><br>
                Rp${subtotal.toLocaleString('id-ID')}
            </div>

            <div class="qty-box">

                <button
                    class="qty-btn"
                    onclick="decrease('${item}')">
                    -
                </button>

                ${qty}

                <button
                    class="qty-btn"
                    onclick="increase('${item}')">
                    +
                </button>

            </div>

        </div>
        `;
    }

    if(count === 0){

        html = `
        <div class="empty">
            Belum ada pesanan
        </div>`;
    }

    document.getElementById("cartList").innerHTML =
        html;

    document.getElementById("itemCount").innerHTML =
        count;

    document.getElementById("totalHarga").innerHTML =
        "Rp" + total.toLocaleString('id-ID');
}
function sendOrder(){

    const paymentMethod =
    document.querySelector(
    'input[name="paymentMethod"]:checked'
    );

    if(!paymentMethod){

        alert("Silakan pilih metode pembayaran");

        return;
    }

    if(Object.keys(cart).length === 0){

        alert("Belum ada pesanan");

        return;
    }

    const customerName =
        document.getElementById("customerName")
        .value
        .trim();

    if(customerName === ""){

        alert("Silakan isi nama terlebih dahulu");

        return;
    }

    let total = 0;

    let message =
`Pesanan Baru

Meja ${tableNumber}
Atas Nama: ${customerName}

`;

    for(let item in cart){

        let qty = cart[item].qty;

        total += qty * cart[item].price;

        message += `${item} x${qty}
`;
    }

    const note =
        document.getElementById("orderNote").value;

   message += `
Total: Rp${total.toLocaleString('id-ID')}

Metode Pembayaran:
${paymentMethod.value}
`;

    if(note.trim() !== ""){

        message += `

Catatan:
${note}
`;
    }

    let url =
        "https://wa.me/6287857365303?text=" +
        encodeURIComponent(message);

    window.open(url,"_blank");
}
renderCart();
</script>

</body>
</html>
