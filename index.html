<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Menu Cafe</title>

<style>
body{
    font-family: Arial,sans-serif;
    max-width:600px;
    margin:auto;
    padding:20px;
}

.menu-item{
    border:1px solid #ddd;
    padding:10px;
    margin:10px 0;
}

button{
    padding:8px 12px;
}

#cart{
    margin-top:20px;
    border-top:2px solid #000;
    padding-top:10px;
}
</style>
</head>

<body>

<h1>Menu Cafe</h1>

<div class="menu-item">
    <h3>Kopi Susu</h3>
    <p>Rp18.000</p>
    <button onclick="addItem('Kopi Susu')">Tambah</button>
</div>

<div class="menu-item">
    <h3>Americano</h3>
    <p>Rp15.000</p>
    <button onclick="addItem('Americano')">Tambah</button>
</div>

<div class="menu-item">
    <h3>Mie Goreng</h3>
    <p>Rp20.000</p>
    <button onclick="addItem('Mie Goreng')">Tambah</button>
</div>

<div id="cart">
    <h2>Pesanan</h2>
    <ul id="cartList"></ul>

    <button onclick="sendOrder()">
        Pesan via WhatsApp
    </button>
</div>

<script>
let cart=[];

function addItem(item){
    cart.push(item);
    renderCart();
}

function renderCart(){
    let html='';

    cart.forEach(item=>{
        html += `<li>${item}</li>`;
    });

    document.getElementById('cartList').innerHTML=html;
}

function sendOrder(){

    if(cart.length===0){
        alert('Belum ada pesanan');
        return;
    }

    let message='Pesanan Baru%0A%0A';

    cart.forEach(item=>{
        message += '- '+item+'%0A';
    });

    window.open(
      'https://wa.me/6287857365303?text='+message,
      '_blank'
    );
}
</script>

</body>
</html>
